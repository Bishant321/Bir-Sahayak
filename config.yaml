project: StudentBank AI
data:
  path: data/sample_transactions.csv
  seed: 42
  test_fraction: 0.20
  validation_fraction: 0.20
features:
  analyzer: char_wb
  ngram_range: [3, 5]
  max_features: 2000
  lowercase: true
training:
  seed: 42
  hidden_size: 64
  dropout: 0.15
  learning_rate: 0.003
  epochs: 40
  batch_size: 32
  patience: 8
inference:
  review_threshold: 0.60
paths:
  model_directory: models
  experiment_directory: experiments/runs
